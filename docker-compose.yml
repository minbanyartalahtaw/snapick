services:
  postgres:
    image: postgres:18-alpine
    container_name: snapick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snapick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snapick}
      POSTGRES_DB: ${POSTGRES_DB:-snapick}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snapick} -d ${POSTGRES_DB:-snapick}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
